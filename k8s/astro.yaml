apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-deployment
  labels:
    app: astro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astro
  template:
    metadata:
      labels:
        app: astro
    spec:
      containers:
        - name: astro
          image: penicili/portoapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
---
kind: Service
apiVersion: v1
metadata:
  name: astro-service
spec:
  selector:
    app: astro
  type: ClusterIP
  ports:
    - port: 4321
      targetPort: 4321
